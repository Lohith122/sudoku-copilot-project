<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Sudoku Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sudoku</h1>
            <div class="header-controls">
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">🌓 Theme</button>
            </div>
        </header>

        <div class="status-bar">
            <span>Time: <span id="timer" class="timer">00:00</span></span>
            <label for="difficulty" style="display:none;">Difficulty</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <div id="win-banner" class="win-banner"></div>

        <div id="sudoku-grid" class="sudoku-grid" role="grid" aria-label="Sudoku Grid"></div>

        <div class="controls-panel">
            <button id="new-game-btn" class="primary-btn">New Game</button>
            <button id="check-btn">Check</button>
            <button id="hint-btn">Hint</button>
        </div>

        <section class="leaderboard">
            <h2>Top 10 Leaderboard</h2>
            <ul id="scores-list" class="scores-list"></ul>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
